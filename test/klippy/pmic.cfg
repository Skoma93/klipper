[pmic protected_load]
output_pin: PH5
fault_pin: ^!PF0
shutdown_value: 0.25
error_severity: silent
fault_off_delay: 2.0
retry_interval: 0.5
retry_toggle_delay: 0.05

[output_pin protected_load]
pin: pmic_protected_load:OUT
pwm: True
value: 0
shutdown_value: 0
cycle_time: 0.01

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000
